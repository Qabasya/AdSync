[project]
name = "adsync"
version = "0.1.0"
description = "fs-adsync — poller service syncing LMS enrollment events into Active Directory accounts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "ldap3",
    "PyYAML",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsync"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["adsync"]

[[tool.mypy.overrides]]
module = "ldap3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
