services:
  adsync:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ_NAME:-Europe/Moscow}
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    ports:
      # Публичный API для сайта (TLS). На роутере проброшен только для исходящего IP сайта.
      - "${PUBLIC_PORT:-8443}:8443"
      # Локальный health/status — только внутри сегмента, на роутер не пробрасывать.
      - "${API_PORT:-8091}:8091"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('API_PORT', '8091') + '/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    extra_hosts:
      - "dc.fs.loc:11.11.11.11"